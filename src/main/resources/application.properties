# Spring Boot Application Configuration
spring.application.name=RepSync Web API

# Server Port (REST API will run on http://localhost:8080)
server.port=8080

# Database Configuration (Aiven Cloud MySQL)
spring.datasource.url=jdbc:mysql://mysql-2c7f8a42-munimunindra928-b7ee.d.aivencloud.com:22277/repsync_db?sslMode=REQUIRED&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=6000
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration (256-bit secret key & 24-hour expiration)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
